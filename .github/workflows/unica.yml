# This is a basic workflow to try to build https://github.com/salvogiangri/UN1CA under Github Actions

name: "Build UN1CA under Github Actions"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        required: true
        default: "a35x"
        type: choice
        options:
          - "a12s"
          - "a22"
          - "a21s"
          - "a51"
          - "a35x"

      debug_build:
        description: "Debug build"
        required: true
        default: false
        type: boolean

      notify_telegram_bot:
        description: "Notify using telegram bot (Make sure you set up the secrets with variables: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: "Build UN1CA"
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: "Checkout"
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # Free disk space (1/3)
      # ---------------------------------------------------------
      - name: "Free disk space (1/3)"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a


      # ---------------------------------------------------------
      # Free disk space (2/3)
      # ---------------------------------------------------------
      - name: "Free disk space (2/3)"
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true


      # ---------------------------------------------------------
      # Free disk space (3/3)
      # ---------------------------------------------------------
      - name: "Free disk space (3/3)"
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'


      # ---------------------------------------------------------
      # Dependencies
      # ---------------------------------------------------------
      - name: "Set up dependencies"
        run: |
          sudo apt update
          sudo apt upgrade -y

          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libbz2-dev libgtest-dev libprotobuf-dev \
            libunwind-dev libpcre2-dev libzstd-dev \
            linux-modules-extra-$(uname -r) \
            lld protobuf-compiler webp openjdk-17-jdk

          sudo modprobe erofs
          sudo modprobe f2fs


      # ---------------------------------------------------------
      # Clone UN1CA + Setup Target
      # ---------------------------------------------------------
      - name: "Clone Base Source & Setup Target"
        run: |
          git clone --recurse-submodules https://github.com/salvogiangri/UN1CA UN1CA

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "===== COPYING A35X TARGET ====="

          mkdir -p UN1CA/target/a35x

          if [ -d "target/a35x" ]; then
            echo "✅ Found target/a35x in repository."
            rsync -a --delete target/a35x/ UN1CA/target/a35x/
          elif [ -d "target/a35" ]; then
            echo "✅ Found target/a35 in repository."
            rsync -a --delete target/a35/ UN1CA/target/a35x/
          else
            echo "❌ Neither target/a35x nor target/a35 exists!"
            exit 1
          fi

          echo ""
          echo "===== RESULTING A35X TARGET ====="
          find UN1CA/target/a35x -maxdepth 3 -type f | sort | head -300

          echo ""
          echo "===== CHECK FOR ACCIDENTAL NESTED UN1CA ====="

          if [ -d "UN1CA/target/a35x/UN1CA" ]; then
            echo "❌ ERROR: Nested UN1CA directory detected!"
            find UN1CA/target/a35x/UN1CA -maxdepth 2 -type f | head -50
            exit 1
          else
            echo "✅ No nested UN1CA directory."
          fi


      # ---------------------------------------------------------
      # Check A35x file_contexts BEFORE BUILD
      # ---------------------------------------------------------
      - name: "Check A35x file_contexts"
        run: |
          echo "=========================================="
          echo "        A35X FILE_CONTEXTS CHECK"
          echo "=========================================="

          echo ""
          echo "===== TARGET VENDOR PATCH FILES ====="

          find UN1CA/target/a35x/patches/vendor \
            -maxdepth 2 \
            -type f \
            -print 2>/dev/null || true

          echo ""
          echo "===== file_contexts_vendor ====="

          FILE="UN1CA/target/a35x/patches/vendor/file_contexts_vendor"

          if [ -f "$FILE" ]; then
            echo "✅ Found:"
            echo "$FILE"
            echo ""
            cat "$FILE"
          else
            echo "❌ file_contexts_vendor NOT FOUND!"
          fi

          echo ""
          echo "=========================================="
          echo "        END A35X CHECK"
          echo "=========================================="


      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      - name: "Build it!"
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          cd UN1CA

          if [[ "${{ github.event.inputs.debug_build }}" = "true" ]]; then
            source buildenv.sh --debug ${{ github.event.inputs.device }}
          else
            source buildenv.sh ${{ github.event.inputs.device }}
          fi

          run_cmd make_rom --build-rom-zip

          cd ..

        continue-on-error: true


      # ---------------------------------------------------------
      # DEBUG GENERATED FILE_CONTEXTS
      # Runs even if build fails.
      # ---------------------------------------------------------
      - name: "Debug vendor file_contexts"
        if: always()
        run: |
          echo "======================================================"
          echo "        UN1CA GENERATED FILE_CONTEXTS DEBUG"
          echo "======================================================"

          FILE="UN1CA/out/target/${{ github.event.inputs.device }}/work_dir/configs/file_context-vendor"

          if [ ! -f "$FILE" ]; then
            echo "❌ file_context-vendor NOT FOUND!"
            exit 0
          fi

          echo "✅ file_context-vendor exists."
          echo ""

          echo "======================================================"
          echo "        LINES 2015 - 2035"
          echo "======================================================"

          nl -ba "$FILE" | sed -n '2015,2035p'

          echo ""
          echo "======================================================"
          echo "        EXACT LINE 2025"
          echo "======================================================"

          sed -n '2025p' "$FILE" | cat -A


      # ---------------------------------------------------------
      # Pull Finished ROM
      # ---------------------------------------------------------
      - name: "Pull Finished ROM"
        if: always()
        run: |
          mkdir -p out

          if [ -d "UN1CA/out" ]; then
            ROMS=$(find UN1CA/out -maxdepth 1 -type f -name "*.zip" -print)
            if [ -n "$ROMS" ]; then
              cp UN1CA/out/*.zip out/
            fi
          fi


      # ---------------------------------------------------------
      # Upload flashable ZIP
      # ---------------------------------------------------------
      - name: "Upload flasheable zip to Github Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UN1CA-ROM-${{ github.event.inputs.device }}
          path: out/*.zip
          if-no-files-found: ignore


      # ---------------------------------------------------------
      # Telegram notification
      # ---------------------------------------------------------
      - name: "Notify Telegram Channel"
        if: ${{ github.event.inputs.notify_telegram_bot == 'true' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            UN1CA build finished
            Action ID: ${{ github.run_id }}
            Device: ${{ github.event.inputs.device }}
