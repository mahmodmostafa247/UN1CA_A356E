name: "Build UN1CA under Github Actions"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        required: true
        default: "a35x"
        type: choice
        options:
          - "a12s"
          - "a22"
          - "a21s"
          - "a51"
          - "a35x"

      debug_build:
        description: "Debug build"
        required: true
        default: false
        type: boolean

      notify_telegram_bot:
        description: "Notify using telegram bot"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: "Build UN1CA"
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # CHECKOUT YOUR REPOSITORY
      # =========================================================
      - name: "Checkout"
        uses: actions/checkout@v4


      # =========================================================
      # FREE DISK SPACE
      # =========================================================
      - name: "Free disk space (1/3)"
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

          sudo docker image prune --all --force
          sudo docker builder prune -a


      - name: "Free disk space (2/3)"
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true


      - name: "Free disk space (3/3)"
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'


      # =========================================================
      # DEPENDENCIES
      # =========================================================
      - name: "Set up dependencies"
        run: |
          sudo apt update
          sudo apt upgrade -y

          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip \
            attr \
            ccache \
            clang \
            ffmpeg \
            libbrotli-dev \
            libbz2-dev \
            libgtest-dev \
            libprotobuf-dev \
            libunwind-dev \
            libpcre2-dev \
            libzstd-dev \
            linux-modules-extra-$(uname -r) \
            lld \
            protobuf-compiler \
            webp \
            openjdk-17-jdk \
            rsync

          sudo modprobe erofs
          sudo modprobe f2fs


      # =========================================================
      # CLONE UN1CA
      # =========================================================
      - name: "Clone UN1CA"
        run: |
          git clone --recurse-submodules \
            https://github.com/salvogiangri/UN1CA \
            UN1CA

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # =========================================================
      # INJECT YOUR TARGET & PATCHES INTO UN1CA
      # =========================================================
      - name: "Inject Target & Patches into UN1CA"
        run: |
          echo "=========================================="
          echo "    INJECTING LOCAL REPO FILES TO UN1CA"
          echo "=========================================="

          # نسخ الملفات والتعديلات من الريبو الحالية لـ UN1CA مع استثناء فولدر UN1CA نفسه والـ .git
          rsync -av --progress . UN1CA/ \
            --exclude 'UN1CA' \
            --exclude '.git' \
            --exclude '.github'

          echo ""
          echo "===== UN1CA TARGET STRUCTURE AFTER INJECTION ====="
          ls -la UN1CA/target/


      # =========================================================
      # BUILD
      # =========================================================
      - name: "Build it!"
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          cd UN1CA

          echo "=========================================="
          echo "        INITIALIZING UN1CA"
          echo "=========================================="

          if [[ "${{ github.event.inputs.debug_build }}" = "true" ]]; then
            source buildenv.sh --debug ${{ github.event.inputs.device }}
          else
            source buildenv.sh ${{ github.event.inputs.device }}
          fi

          echo ""
          echo "=========================================="
          echo "        BUILDING ROM"
          echo "=========================================="

          run_cmd make_rom --build-rom-zip

          cd ..

        continue-on-error: true


      # =========================================================
      # DEBUG OUTPUT
      # =========================================================
      - name: "Debug build output"
        if: always()
        run: |
          echo "=========================================="
          echo "        BUILD OUTPUT"
          echo "=========================================="

          if [ -d "UN1CA/out" ]; then
            find UN1CA/out \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -500
          else
            echo "❌ UN1CA/out does not exist."
          fi


      # =========================================================
      # DEBUG GENERATED FILE_CONTEXTS
      # =========================================================
      - name: "Debug vendor file_contexts"
        if: always()
        run: |
          echo "======================================================"
          echo "        GENERATED FILE_CONTEXTS"
          echo "======================================================"

          echo ""
          echo "Searching for file_context-vendor..."

          find UN1CA/out \
            -type f \
            -name "file_context-vendor" \
            -print 2>/dev/null || true


      # =========================================================
      # PULL ROM
      # =========================================================
      - name: "Pull Finished ROM"
        if: always()
        run: |
          mkdir -p out

          if [ -d "UN1CA/out" ]; then
            ROMS=$(find UN1CA/out -maxdepth 1 -type f -name "*.zip" -print)
            if [ -n "$ROMS" ]; then
              cp UN1CA/out/*.zip out/
            fi
          fi


      # =========================================================
      # UPLOAD ROM
      # =========================================================
      - name: "Upload flashable ZIP"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UN1CA-ROM-${{ github.event.inputs.device }}
          path: out/*.zip
          if-no-files-found: ignore


      # =========================================================
      # TELEGRAM
      # =========================================================
      - name: "Notify Telegram Channel"
        if: ${{ github.event.inputs.notify_telegram_bot == 'true' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            UN1CA build finished
            Action ID: ${{ github.run_id }}
            Device: ${{ github.event.inputs.device }}
