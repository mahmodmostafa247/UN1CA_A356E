# This is a basic workflow to try to build https://github.com/salvogiangri/UN1CA under Github Actions

name: "Build UN1CA under Github Actions"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        required: true
        default: "a35x"
        type: choice
        options:
          - "a12s"
          - "a22"
          - "a21s"
          - "a51"
          - "a35x"

      debug_build:
        description: "Debug build"
        required: true
        default: false
        type: boolean

      notify_telegram_bot:
        description: "Notify using telegram bot (Make sure you set up the secrets with variables: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: "Build UN1CA"
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: "Checkout"
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # Free disk space (1/3)
      # ---------------------------------------------------------
      - name: "Free disk space (1/3)"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a


      # ---------------------------------------------------------
      # Free disk space (2/3)
      # ---------------------------------------------------------
      - name: "Free disk space (2/3)"
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true


      # ---------------------------------------------------------
      # Free disk space (3/3)
      # ---------------------------------------------------------
      - name: "Free disk space (3/3)"
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'


      # ---------------------------------------------------------
      # Dependencies
      # ---------------------------------------------------------
      - name: "Set up dependencies"
        run: |
          sudo apt update
          sudo apt upgrade -y

          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libbz2-dev libgtest-dev libprotobuf-dev \
            libunwind-dev libpcre2-dev libzstd-dev \
            linux-modules-extra-$(uname -r) \
            lld protobuf-compiler webp openjdk-17-jdk

          sudo modprobe erofs
          sudo modprobe f2fs


      # ---------------------------------------------------------
      # Clone UN1CA + Copy target files
      # ---------------------------------------------------------
      - name: "Clone Base Source & Setup Target"
        run: |
          git clone --recurse-submodules https://github.com/salvogiangri/UN1CA UN1CA

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Copy your repo's target files into UN1CA source
          mkdir -p UN1CA/target/a35x

          cp -r target/a35/* UN1CA/target/a35x/ \
            2>/dev/null || \
          cp -r * UN1CA/target/a35x/ \
            2>/dev/null || true

          echo "===== TARGET DIRECTORY ====="
          find UN1CA/target/a35x -maxdepth 3 -type f | sort | head -300


      # ---------------------------------------------------------
      # FIND ORIGINAL FILE_CONTEXTS SOURCES
      # ---------------------------------------------------------
      - name: "Find malformed file_contexts sources"
        run: |
          cd UN1CA

          echo "=========================================="
          echo " Searching source file_contexts"
          echo "=========================================="

          echo ""
          echo "===== SRIBmidas ====="
          grep -Rni --exclude-dir=.git \
            "SRIBmidas_aiUPSCALER" . 2>/dev/null || true

          echo ""
          echo "===== sehradio ====="
          grep -Rni --exclude-dir=.git \
            "sehradio_manifest_2_30" . 2>/dev/null || true

          echo ""
          echo "===== audio_policy ====="
          grep -Rni --exclude-dir=.git \
            "audio_policy_configuration_sec" . 2>/dev/null || true

          echo ""
          echo "===== radio 1.6 ====="
          grep -Rni --exclude-dir=.git \
            "android\.hardware\.radio@1\.6" . 2>/dev/null || true

          echo ""
          echo "===== light V1 ====="
          grep -Rni --exclude-dir=.git \
            "vendor\.samsung\.hardware\.light-V1-ndk_platform" . 2>/dev/null || true

          echo ""
          echo "===== tlc iccc ====="
          grep -Rni --exclude-dir=.git \
            "vendor\.samsung\.hardware\.tlc\.iccc@1\.0" . 2>/dev/null || true

          echo ""
          echo "===== radio 1.5 ====="
          grep -Rni --exclude-dir=.git \
            "android\.hardware\.radio@1\.5" . 2>/dev/null || true

          echo ""
          echo "=========================================="
          echo " Search finished"
          echo "=========================================="


      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      - name: "Build it!"
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          cd UN1CA

          if [[ "${{ github.event.inputs.debug_build }}" = "true" ]]; then
            source buildenv.sh --debug ${{ github.event.inputs.device }}
          else
            source buildenv.sh ${{ github.event.inputs.device }}
          fi

          run_cmd make_rom --build-rom-zip

          cd ..

        continue-on-error: true


      # ---------------------------------------------------------
      # DEBUG FILE_CONTEXTS
      # This runs even if the build fails.
      # ---------------------------------------------------------
      - name: "Debug vendor file_contexts"
        if: always()
        run: |
          echo "======================================================"
          echo "        UN1CA FILE_CONTEXTS DEBUG"
          echo "======================================================"

          FILE="UN1CA/out/target/${{ github.event.inputs.device }}/work_dir/configs/file_context-vendor"

          echo ""
          echo "Checking:"
          echo "$FILE"
          echo ""

          if [ ! -f "$FILE" ]; then
            echo "❌ file_context-vendor NOT FOUND!"
            echo ""
            echo "Searching for all file_context-vendor files..."

            find UN1CA/out \
              -type f \
              -name "file_context-vendor" \
              -print 2>/dev/null || true

            echo ""
            echo "Searching for all file_context files..."

            find UN1CA/out \
              -type f \
              \( -name "file_context*" -o -name "*file_context*" \) \
              -print 2>/dev/null | head -100 || true

            exit 0
          fi

          echo "✅ file_context-vendor exists."
          echo ""

          echo "===== FILE INFORMATION ====="
          ls -lh "$FILE"
          wc -l "$FILE"

          echo ""
          echo "======================================================"
          echo "        LINES 2015 - 2035"
          echo "======================================================"

          nl -ba "$FILE" | sed -n '2015,2035p'

          echo ""
          echo "======================================================"
          echo "        RAW CONTENT AROUND LINE 2025"
          echo "======================================================"

          sed -n '2015,2035p' "$FILE" | cat -A

          echo ""
          echo "======================================================"
          echo "        MALFORMED LINES"
          echo "======================================================"

          BAD_LINES=$(awk '
            NF && $1 !~ /^#/ && NF < 2 {
              print "BAD LINE " NR ": " $0
            }
          ' "$FILE")

          if [ -n "$BAD_LINES" ]; then
            echo "❌ Malformed lines found:"
            echo "$BAD_LINES"
          else
            echo "✅ No obvious lines with fewer than 2 fields found."
          fi

          echo ""
          echo "======================================================"
          echo "        EXACT LINE 2025"
          echo "======================================================"

          sed -n '2025p' "$FILE" | cat -A

          echo ""
          echo "===== FIELD COUNT FOR LINE 2025 ====="

          awk 'NR == 2025 {
            print "Fields:", NF
            for (i = 1; i <= NF; i++)
              print "FIELD " i ": [" $i "]"
          }' "$FILE"

          echo ""
          echo "======================================================"
          echo "        CONTEXT CHECK"
          echo "======================================================"

          awk '
            NR >= 2020 && NR <= 2030 {
              printf "LINE %d | fields=%d | %s\n", NR, NF, $0
            }
          ' "$FILE"

          echo ""
          echo "======================================================"
          echo "        END FILE_CONTEXTS DEBUG"
          echo "======================================================"


      # ---------------------------------------------------------
      # Pull Finished ROM
      # ---------------------------------------------------------
      - name: "Pull Finished ROM"
        if: always()
        run: |
          mkdir -p out

          echo "Checking UN1CA output directory..."

          if [ -d "UN1CA/out" ]; then
            ls -lah UN1CA/out
          else
            echo "UN1CA/out does not exist."
            exit 0
          fi

          echo ""
          echo "Searching for ROM ZIP..."

          ROMS=$(find UN1CA/out -maxdepth 1 -type f -name "*.zip" -print)

          if [ -n "$ROMS" ]; then
            echo "ROM ZIP files found:"
            echo "$ROMS"

            cp UN1CA/out/*.zip out/
          else
            echo "No ROM ZIP was produced."
          fi


      # ---------------------------------------------------------
      # Upload flashable ZIP
      # ---------------------------------------------------------
      - name: "Upload flasheable zip to Github Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: out/UN1CA_*${{ github.event.inputs.device }}*.zip
          archive: false
          if-no-files-found: ignore


      # ---------------------------------------------------------
      # Upload target_files.zip
      # ---------------------------------------------------------
      - name: "Upload target_files.zip to Github Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: out/${{ github.event.inputs.device }}_*-target_files.zip
          archive: false
          if-no-files-found: ignore


      # ---------------------------------------------------------
      # Telegram notification
      # ---------------------------------------------------------
      - name: "Notify Telegram Channel"
        if: ${{ github.event.inputs.notify_telegram_bot == 'true' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            UN1CA build finished
            Action ID: ${{ github.run_id }}
            Device: ${{ github.event.inputs.device }}
